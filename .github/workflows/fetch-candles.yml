name: Fetch Deriv Candles

on:
  schedule:
    # Run every 30 minutes at minute 0 and 30
    - cron: '0,30 * * * *'
  # Allow manual trigger from GitHub UI
  workflow_dispatch:
    inputs:
      mode:
        description: 'Mode (initial or update)'
        required: false
        default: 'update'
        type: choice
        options:
          - update
          - initial

jobs:
  fetch-candles:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install dependencies
        run: |
          npm install @supabase/supabase-js ws
      
      - name: Run candle fetcher
        run: node .github/scripts/fetch-candles.js
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          MODE: ${{ github.event.inputs.mode || 'update' }}
